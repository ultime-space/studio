name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing（OIDC）必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const v=require("./package.json").version; const tag=process.env.GITHUB_REF_NAME; if (tag !== "v" + v) { console.error("tag " + tag + " does not match v" + v); process.exit(1) }'

      - name: Check version is not published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published; bump the version first."
            exit 1
          fi

      - run: pnpm install

      # 用 npm 发布：Trusted Publishing（OIDC）是 npm CLI 的能力，pnpm publish 会静默跳过。
      # npm 同样会跑 prepublishOnly（check / test / build），产物不进 git 但进 tarball。
      - name: Publish
        run: npm publish --access public --provenance

      - name: Verify published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version 已在 registry 上"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$name@$version 发布后查不到，检查 Publish 步骤日志"
          exit 1
