name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      # 暂时不开 cache：本仓还没有 pnpm-lock.yaml，setup-node 无文件可哈希
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install

      - run: pnpm check

      - run: pnpm test
